version: '3.8'

services:
  # BullMQ Redis Queue Service
  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Nexa Backend API (Connects to Supabase Database)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexa-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-nexa-production-secure-key-2026}
      - NEXA_ADMIN_USER=${NEXA_ADMIN_USER:-admin}
      - NEXA_ADMIN_PASS=${NEXA_ADMIN_PASS:-admin}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      redis:
        condition: service_healthy

  # Nexa Web Command Center UI (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nexa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - api

volumes:
  redis_data:
